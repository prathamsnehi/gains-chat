name: Dependency and migration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, functions, tooling]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.1.cjs test
      - uses: actions/setup-java@v6.1.0
        if: matrix.project == 'functions'
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.project == 'frontend'
        run: |
          node .yarn/releases/yarn-4.18.1.cjs typecheck
          node .yarn/releases/yarn-4.18.1.cjs check:sdk
          node .yarn/releases/yarn-4.18.1.cjs expo install --check
          node .yarn/releases/yarn-4.18.1.cjs check:native
          node .yarn/releases/yarn-4.18.1.cjs expo export --platform ios --output-dir dist
      - if: matrix.project == 'functions'
        run: |
          node .yarn/releases/yarn-4.18.1.cjs check:firestore
          node .yarn/releases/yarn-4.18.1.cjs test:firestore
          node ../scripts/check-runtime-compatibility.cjs
          node ../scripts/check-functions-package.cjs
      - name: Audit all dependencies and production dependencies
        run: node ../scripts/check-dependency-audit.cjs ${{ matrix.project }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dependency-audit-${{ matrix.project }}
          path: ${{ matrix.project }}/audit-*.jsonl
