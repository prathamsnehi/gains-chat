name: Test

on:
  push:
  pull_request:

jobs:
  gains-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Test the on-device parser and router
        working-directory: ios/GainsCore
        run: swift test

  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test the chat function
        working-directory: hosting/functions
        run: node --test chatCore.test.js
