name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gains-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Test the on-device parser and router
        working-directory: ios/GainsCore
        run: swift test

  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test the chat function
        working-directory: hosting/functions
        run: node --test chatCore.test.js

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show the Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test GainsCore with the Apple toolchain
        working-directory: ios/GainsCore
        run: swift test
      - name: Build Gains Chat for the iOS Simulator
        run: |
          xcodebuild \
            -project ios/GainsChat.xcodeproj \
            -scheme GainsChat \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
